name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release at this version, e.g. 0.1.0. Leave empty to only build."
        required: false
        default: ""

jobs:
  windows:
    name: Windows (.NET Framework 4.6.2, WinForms)
    # Windows-hosted because this head targets .NET Framework and WinForms,
    # neither of which builds on a Linux runner.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release)
        run: msbuild WindowsWeatherApp.sln /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal /warnaserror:CS0168,CS0219

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: WindowsWeather-win
          path: |
            src/WeatherApp.WinForms/bin/Release/WindowsWeather.exe
            src/WeatherApp.WinForms/bin/Release/WindowsWeather.exe.config
          if-no-files-found: error

  linux:
    name: Linux (.NET 10, Avalonia)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build (Release)
        run: dotnet build src/WeatherApp.Desktop/WeatherApp.Desktop.csproj -c Release -warnaserror

      - name: Package tarball and AppImage
        run: ./packaging/linux/build-linux.sh

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          # The tarball is the guaranteed output and preserves the executable bit
          # internally; the AppImage is best-effort because appimagetool needs FUSE.
          name: WindowsWeather-linux
          path: |
            artifacts/linux/*.tar.gz
            artifacts/linux/*.AppImage
          if-no-files-found: error

  macos:
    name: macOS (.NET 10, Avalonia)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build (Release)
        run: dotnet build src/WeatherApp.Desktop/WeatherApp.Desktop.csproj -c Release -warnaserror

      - name: Package .app bundle
        run: ./packaging/macos/build-app.sh

      - name: Archive the bundle
        # ditto, not zip: uploading a .app as a directory loses the executable bit
        # when Actions re-zips it, and the app then will not launch. Archiving it
        # here means the permissions live inside a file Actions treats as opaque.
        run: |
          cd artifacts/macos
          ditto -c -k --keepParent "Windows Weather.app" "WindowsWeather-macos-arm64.zip"

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: WindowsWeather-macos
          path: artifacts/macos/WindowsWeather-macos-arm64.zip
          if-no-files-found: error

  android:
    name: Android (.NET 10, Avalonia)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the Android workload
        run: dotnet workload install android

      # publish, not build: for Android it is publish that packages and signs the
      # APK. AndroidKeyStore=false signs with the Android debug key, which is what
      # makes the result installable by sideloading without this repository having
      # to hold a private signing key. It is not a Play Store identity.
      #
      # No -warnaserror here, unlike the other Avalonia heads: the Android SDK
      # targets emit warnings of their own that have nothing to do with this code.
      - name: Publish and sign (Release)
        run: >
          dotnet publish src/WeatherApp.Android/WeatherApp.Android.csproj
          -c Release
          -p:AndroidKeyStore=false

      # The [Application] and [Activity] attributes are compiled into a manifest
      # by the build, and a mistake there does not fail the build -- it produces
      # an APK that installs and then closes the moment it is opened, because
      # nothing is registered to start. Reading the manifest back out of the
      # finished APK is the only way to be sure of what the phone will see, so
      # the two registrations the app cannot run without are asserted here.
      - name: Verify the manifest registers the app
        run: |
          set -euo pipefail

          APK=$(find src/WeatherApp.Android/bin/Release -name '*-Signed.apk' | sort | head -1)
          if [ -z "$APK" ]; then
            APK=$(find src/WeatherApp.Android/bin/Release -name '*.apk' | sort | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced." >&2
            exit 1
          fi

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT2=$(find "$SDK/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT2" ]; then
            echo "::error::aapt2 not found; cannot read the merged manifest." >&2
            exit 1
          fi

          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt

          # Printed whichever way the assertions go: when one fails, this is the
          # difference between knowing the manifest is wrong and knowing only
          # that the check could not read it. aapt2 writes attribute names as
          # the full namespace URI, so the patterns below match ":name(" rather
          # than an "android:" prefix.
          echo '--- manifest skeleton ---'
          grep -E '^ *(E: |.*:name\()' manifest.txt | head -60
          echo '--- end ---'

          # The application element's android:name is the class Android
          # instantiates, and Avalonia is started from ours. Read that one
          # attribute rather than searching the whole file: a name that appears
          # somewhere in the manifest proves nothing about what will be run.
          APPLICATION=$(awk '
            /^ *E: application \(/ { inside = 1; next }
            inside && /^ *E: / { inside = 0 }
            inside && /A: .*:name\(/ {
              if (match($0, /="[^"]*"/)) {
                print substr($0, RSTART + 2, RLENGTH - 3)
                exit
              }
            }' manifest.txt)

          # Tracked per activity: the application element carries a name too, and
          # picking that one up would report it as the launcher.
          LAUNCHER=$(awk '
            /^ *E: activity \(/ { in_activity = 1; name = ""; next }
            /^ *E: (application|activity-alias|service|receiver|provider) \(/ { in_activity = 0 }
            in_activity && name == "" && /A: .*:name\(/ {
              if (match($0, /="[^"]*"/)) name = substr($0, RSTART + 2, RLENGTH - 3)
            }
            in_activity && /android.intent.category.LAUNCHER/ { print name; exit }' manifest.txt)

          echo "Application class: ${APPLICATION:-(none)}"
          echo "Launcher activity: ${LAUNCHER:-(none)}"

          # Without this, Android uses its own Application, Avalonia is never
          # initialised, and every launch fails identically and silently.
          case "$APPLICATION" in
            *.AndroidApp) ;;
            *)
              echo "::error::The application element names '${APPLICATION:-nothing}', not AndroidApp." >&2
              exit 1
              ;;
          esac

          case "$LAUNCHER" in
            *.LauncherActivity) ;;
            *)
              echo "::error::The launcher activity is '${LAUNCHER:-none}', not LauncherActivity." >&2
              exit 1
              ;;
          esac

          {
            echo '### Android manifest'
            echo ''
            echo "- Application class: \`${APPLICATION}\`"
            echo "- Launcher activity: \`${LAUNCHER}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Avalonia's AvaloniaMainActivity is an androidx AppCompatActivity, and
      # AppCompatDelegate throws from setContentView under any theme that is not
      # a Theme.AppCompat descendant. That throw happens after the activity is on
      # screen, so the app opens and closes with nothing to see -- it cost three
      # releases to find. Nothing in the build catches it, so this does.
      - name: Verify the activity theme descends from AppCompat
        run: |
          set -euo pipefail

          STYLES=src/WeatherApp.Android/Resources/values/styles.xml
          PARENT=$(sed -n 's/.*<style name="AppTheme" parent="\([^"]*\)".*/\1/p' "$STYLES")

          echo "AppTheme parent: ${PARENT:-(not found)}"

          case "$PARENT" in
            Theme.AppCompat*) ;;
            *)
              echo "::error file=$STYLES::AppTheme inherits '${PARENT:-nothing}'. Avalonia's activity requires a Theme.AppCompat descendant, and any other theme crashes it at startup." >&2
              exit 1
              ;;
          esac

      # An unsigned APK installs on nothing, and the failure mode is silent: the
      # build succeeds and the file is simply rejected by the phone. Verifying
      # here turns that into a red build instead of a bad download.
      - name: Verify the APK is signed
        run: |
          set -euo pipefail

          APK=$(find src/WeatherApp.Android/bin/Release -name '*-Signed.apk' | sort | head -1)
          if [ -z "$APK" ]; then
            APK=$(find src/WeatherApp.Android/bin/Release -name '*.apk' | sort | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced." >&2
            exit 1
          fi
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found; cannot prove the APK is signed." >&2
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" WindowsWeather-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WindowsWeather-android
          path: WindowsWeather-android.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows, linux, macos, android]
    # Either a v* tag was pushed, or someone dispatched the workflow with a
    # version. The dispatch path exists because a tag cannot always be pushed
    # directly; gh creates the tag server-side from the commit being built.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
    runs-on: ubuntu-latest
    permissions:
      # Required to create the release and upload its assets.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Resolve the version
        id: version
        # Read through the environment rather than interpolating the input
        # straight into the script, so the value can never be executed as shell.
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::\"$VERSION\" is not a semantic version." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Assemble release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p assets

          # Windows ships as a zip because it is two files, and permissions are
          # not meaningful there anyway.
          (cd dist/WindowsWeather-win && zip -q -r "$GITHUB_WORKSPACE/assets/WindowsWeather-$VERSION-windows.zip" .)

          cp dist/WindowsWeather-macos/*.zip     "assets/WindowsWeather-$VERSION-macos-arm64.zip"
          cp dist/WindowsWeather-linux/*.tar.gz  "assets/WindowsWeather-$VERSION-linux-x64.tar.gz"
          cp dist/WindowsWeather-android/*.apk   "assets/WindowsWeather-$VERSION-android.apk"

          # Best-effort, exactly as in the Linux job.
          cp dist/WindowsWeather-linux/*.AppImage "assets/WindowsWeather-$VERSION-linux-x86_64.AppImage" 2>/dev/null || true

          ls -lh assets

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # --target makes gh create the tag at this commit when it does not
          # already exist, which is what the dispatch path relies on.
          gh release create "v$VERSION" assets/* \
            --target "$GITHUB_SHA" \
            --title "Windows Weather $VERSION" \
            --notes-file .github/release-notes.md
