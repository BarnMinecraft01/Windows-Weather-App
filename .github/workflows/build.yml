name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (.NET Framework 4.6.2, WinForms)
    # Windows-hosted because this head targets .NET Framework and WinForms,
    # neither of which builds on a Linux runner.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release)
        run: msbuild WindowsWeatherApp.sln /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal /warnaserror:CS0168,CS0219

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: WindowsWeather-win
          path: |
            src/WeatherApp.WinForms/bin/Release/WindowsWeather.exe
            src/WeatherApp.WinForms/bin/Release/WindowsWeather.exe.config
          if-no-files-found: error

  linux:
    name: Linux (.NET 10, Avalonia)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build (Release)
        run: dotnet build src/WeatherApp.Desktop/WeatherApp.Desktop.csproj -c Release -warnaserror

      - name: Package tarball and AppImage
        run: ./packaging/linux/build-linux.sh

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          # The tarball is the guaranteed output and preserves the executable bit
          # internally; the AppImage is best-effort because appimagetool needs FUSE.
          name: WindowsWeather-linux
          path: |
            artifacts/linux/*.tar.gz
            artifacts/linux/*.AppImage
          if-no-files-found: error

  macos:
    name: macOS (.NET 10, Avalonia)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build (Release)
        run: dotnet build src/WeatherApp.Desktop/WeatherApp.Desktop.csproj -c Release -warnaserror

      - name: Package .app bundle
        run: ./packaging/macos/build-app.sh

      - name: Archive the bundle
        # ditto, not zip: uploading a .app as a directory loses the executable bit
        # when Actions re-zips it, and the app then will not launch. Archiving it
        # here means the permissions live inside a file Actions treats as opaque.
        run: |
          cd artifacts/macos
          ditto -c -k --keepParent "Windows Weather.app" "WindowsWeather-macos-arm64.zip"

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: WindowsWeather-macos
          path: artifacts/macos/WindowsWeather-macos-arm64.zip
          if-no-files-found: error

  android:
    name: Android (.NET 10, Avalonia)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the Android workload
        run: dotnet workload install android

      # publish, not build: for Android it is publish that packages and signs the
      # APK. AndroidKeyStore=false signs with the Android debug key, which is what
      # makes the result installable by sideloading without this repository having
      # to hold a private signing key. It is not a Play Store identity.
      #
      # No -warnaserror here, unlike the other Avalonia heads: the Android SDK
      # targets emit warnings of their own that have nothing to do with this code.
      - name: Publish and sign (Release)
        run: >
          dotnet publish src/WeatherApp.Android/WeatherApp.Android.csproj
          -c Release
          -p:AndroidKeyStore=false

      # An unsigned APK installs on nothing, and the failure mode is silent: the
      # build succeeds and the file is simply rejected by the phone. Verifying
      # here turns that into a red build instead of a bad download.
      - name: Verify the APK is signed
        run: |
          set -euo pipefail

          APK=$(find src/WeatherApp.Android/bin/Release -name '*-Signed.apk' | sort | head -1)
          if [ -z "$APK" ]; then
            APK=$(find src/WeatherApp.Android/bin/Release -name '*.apk' | sort | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced." >&2
            exit 1
          fi
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found; cannot prove the APK is signed." >&2
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" WindowsWeather-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WindowsWeather-android
          path: WindowsWeather-android.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows, linux, macos, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # Required to create the release and upload its assets.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Assemble release assets
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p assets

          # Windows ships as a zip because it is two files, and permissions are
          # not meaningful there anyway.
          (cd dist/WindowsWeather-win && zip -q -r "$GITHUB_WORKSPACE/assets/WindowsWeather-$VERSION-windows.zip" .)

          cp dist/WindowsWeather-macos/*.zip     "assets/WindowsWeather-$VERSION-macos-arm64.zip"
          cp dist/WindowsWeather-linux/*.tar.gz  "assets/WindowsWeather-$VERSION-linux-x64.tar.gz"
          cp dist/WindowsWeather-android/*.apk   "assets/WindowsWeather-$VERSION-android.apk"

          # Best-effort, exactly as in the Linux job.
          cp dist/WindowsWeather-linux/*.AppImage "assets/WindowsWeather-$VERSION-linux-x86_64.AppImage" 2>/dev/null || true

          ls -lh assets

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "Windows Weather $VERSION" \
            --notes-file .github/release-notes.md \
            --verify-tag
